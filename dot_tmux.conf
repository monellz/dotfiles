set -g mouse on

# ESC 与 Alt+<key> 在终端里编码相同（都是 ESC <key>），tmux 靠此间隔区分二者。
# 默认 500ms 会把「Esc 后快按 j」误合成 M-j；10ms 足以区分终端连发与人手两次按键。
set -sg escape-time 10

# yazi 26.9.1 在 tmux 里启动时要通过 passthrough 问外层终端，退出前会等这个回复，最多 5 秒。
# passthrough 没开就等不到回复，表现为按 q 后卡住约 5 秒，像是要按两次才能退出。
# yazi 自己会尝试设置，但它设的值 all 要 tmux 3.4 才认识，3.3a 上会失败，所以在这里设成 on。
set -g allow-passthrough on


# nvim 用：tmux 里显示真彩色，否则配色会失真
set -as terminal-features ",*:RGB"
# nvim 用：允许程序通过 OSC52 写本机剪贴板，否则 ssh 时 yank 不到本机
set -g set-clipboard on
